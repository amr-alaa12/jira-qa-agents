# Used by Vercel to deploy the web version (web/server.py).
# Local development and the Streamlit app keep using requirements.txt.
[project]
name = "jira-qa-agents"
version = "1.0.0"
description = "Classify Jira acceptance criteria and generate test cases with input and expected output"
requires-python = ">=3.12"
# Only what the web app needs at runtime (no Streamlit or pandas), to keep the Vercel bundle small.
dependencies = [
    "flask==3.1.3",
    "cryptography",          # encrypts the Atlassian login token in the cookie
    "requests",
    "python-dotenv",
    "scikit-learn==1.9.1",   # must be the version that trained model/model.pkl
    "joblib",
]

[tool.vercel]
entrypoint = "web.server:app"
